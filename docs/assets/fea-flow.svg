<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c6ef5"/></marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <g>
    <rect x="30" y="90" width="200" height="120" rx="12" fill="#eef2ff" stroke="#4c6ef5" stroke-width="2"/>
    <text x="130" y="128" text-anchor="middle" font-size="18" font-weight="600" fill="#1e2a5a">AI agent</text>
    <text x="130" y="152" text-anchor="middle" font-size="13" fill="#3b4a7a">Claude Code, Cursor,</text>
    <text x="130" y="170" text-anchor="middle" font-size="13" fill="#3b4a7a">any MCP client</text>
    <text x="130" y="194" text-anchor="middle" font-size="12" fill="#6b7aa6">asks, reasons, reports</text>
  </g>
  <g>
    <rect x="350" y="60" width="200" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">FEA</text>
    <text x="450" y="118" text-anchor="middle" font-size="12" fill="#166534">MCP server + CLI</text>
    <text x="450" y="146" text-anchor="middle" font-size="12" fill="#166534">sleuthkit  ·  registry  ·  evtx</text>
    <text x="450" y="164" text-anchor="middle" font-size="12" fill="#166534">sqlite  ·  ESE  ·  prefetch  ·  lnk</text>
    <text x="450" y="182" text-anchor="middle" font-size="12" fill="#166534">unallocated  ·  yara  ·  exif</text>
    <text x="450" y="212" text-anchor="middle" font-size="12" fill="#3f6212">read-only, local, evidence attached</text>
  </g>
  <g>
    <rect x="670" y="90" width="200" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="770" y="128" text-anchor="middle" font-size="18" font-weight="600" fill="#7c2d12">Disk images</text>
    <text x="770" y="152" text-anchor="middle" font-size="13" fill="#9a3412">raw · split raw · E01</text>
    <text x="770" y="170" text-anchor="middle" font-size="13" fill="#9a3412">NTFS · ext4 · FAT · HFS+ · APFS</text>
    <text x="770" y="194" text-anchor="middle" font-size="12" fill="#c2410c">Windows · Linux · Android</text>
  </g>
  <path d="M230 135 L350 135" stroke="#4c6ef5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="290" y="125" text-anchor="middle" font-size="12" fill="#4c6ef5">tool calls</text>
  <path d="M350 170 L230 170" stroke="#4c6ef5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="290" y="190" text-anchor="middle" font-size="12" fill="#4c6ef5">data + evidence + limits</text>
  <path d="M550 150 L670 150" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="610" y="140" text-anchor="middle" font-size="12" fill="#ea580c">reads only</text>
  <text x="450" y="275" text-anchor="middle" font-size="13" fill="#64748b">locate  →  inspect  →  parse in place  →  dig (deleted, unallocated, swap)  →  report with evidence</text>
</svg>
