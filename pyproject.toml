[project]
name = "fea"
version = "0.1.0"
description = "FEA - Forensic Evidence Agent: one MCP server and CLI for disk-image forensics (Windows, macOS, Linux)"
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Operating System :: OS Independent", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = [
    "click>=8.5.0",
    "dissect-esedb>=3.18",
    "evtx>=0.13.1",
    "liblnk-python>=20260525",
    "libscca-python>=20260527",
    "mcp[cli]>=2.3.0",
    "pillow>=13.0.0",
    "puremagic>=2.2.0",
    "pytsk3>=20260715",
    "regipy>=6.5.0",
    "tomli-w>=1.2.0",
    "tzdata>=2026.5",
    "yara-python>=4.5.4",
]

[project.scripts]
fea = "fea:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
